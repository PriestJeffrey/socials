services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pulseboard
      POSTGRES_PASSWORD: pulseboard
      POSTGRES_DB: pulseboard
    volumes:
      - pulseboard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseboard -d pulseboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://pulseboard:pulseboard@postgres:5432/pulseboard
      APP_URL: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env — no weak default}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in .env}
      COOKIE_SECURE: "false"
      META_USE_FIXTURES: "true"
      LINKEDIN_USE_FIXTURES: "true"
      THREADS_USE_FIXTURES: "true"
      TIKTOK_USE_FIXTURES: "true"
      YOUTUBE_USE_FIXTURES: "true"
      PINTEREST_USE_FIXTURES: "true"
      BLUESKY_USE_FIXTURES: "true"
      REDDIT_USE_FIXTURES: "true"
      MASTODON_USE_FIXTURES: "true"
      TUMBLR_USE_FIXTURES: "true"
      TWITCH_USE_FIXTURES: "true"
      DISCORD_USE_FIXTURES: "true"
      SLACK_USE_FIXTURES: "true"
      GEMINI_USE_FIXTURES: "true"
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env — no weak default}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pulseboard_pg:
